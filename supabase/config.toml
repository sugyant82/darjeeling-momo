# Local Supabase config. This is the REAL Supabase stack running locally via
# Docker, so no code changes are needed when you move to a hosted project.
project_id = "darjeeling-momo"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
# Off by default to save memory on small machines; set true to browse data at :54323.
enabled = false
port = 54323

# Local email testing. All dev magic links / confirmations land here.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.image_transformation]
# imgproxy is not needed locally (menu photos are served as uploaded).
enabled = false

[storage.buckets.menu-photos]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000",
  "http://localhost:3000/auth/callback",
  "darjeelingmomo://auth/callback",
  "exp://127.0.0.1:8081",
]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = false
# Local dev: no confirmation needed so seeded users sign in immediately.
enable_confirmations = false

# --- Real providers (switched on by env when keys exist). Disabled locally. ---
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = ""

[auth.external.apple]
enabled = false
client_id = "env(SUPABASE_AUTH_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_APPLE_SECRET)"

[functions.create-payment]
verify_jwt = true

[functions.confirm-mock-payment]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

# Stripe webhook must accept unauthenticated calls from Stripe (verified by signature).
[functions.payment-webhook]
verify_jwt = false

[analytics]
# Logflare + Vector are heavy and unused locally; keep off.
enabled = false
